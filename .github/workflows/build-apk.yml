name: Build and Release HabitSeen APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Package Live OTA Web Bundle
        run: |
          cd dist && zip -r ../bundle.zip . && cd ..
          ls -lh bundle.zip

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          yes | sdkmanager --channel=3 --licenses || true
          sdkmanager --channel=3 "platforms;android-36" || true
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-36" || true
          fi
          ls -la "$ANDROID_HOME/platforms"

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets/public
          node ./node_modules/@capacitor/cli/bin/capacitor sync android || node ./node_modules/@capacitor/cli/bin/capacitor copy android

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log || {
            ERR_MSG=$(tail -n 10 /tmp/gradle.log | tr '\r\n' ' ')
            echo "::error file=android/build.gradle,title=Gradle Failure::$ERR_MSG"
            exit 1
          }

      - name: Verify and Prepare Generated APK
        run: |
          ls -la android/app/build/outputs/apk/debug/ || true
          APK_PATH=$(find android -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No APK was produced by Gradle!"
            find android -name "*.apk" || true
            exit 1
          fi
          mkdir -p android/app/build/outputs/apk/debug
          if [ "$APK_PATH" != "android/app/build/outputs/apk/debug/HabitSeen.apk" ]; then
            cp "$APK_PATH" android/app/build/outputs/apk/debug/HabitSeen.apk
          fi
          test -f android/app/build/outputs/apk/debug/HabitSeen.apk
          ls -lh android/app/build/outputs/apk/debug/HabitSeen.apk

      - name: Extract Commit Info
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          TAG_NAME="v1.0.0-$SHORT_SHA"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: HabitSeen ${{ steps.vars.outputs.tag_name }}
          body: |
            ### 🚀 HabitSeen Automatic Cloud Build
            * **Commit**: `${{ steps.vars.outputs.short_sha }}`
            * **Message**: ${{ steps.vars.outputs.commit_msg }}
            * **Built by**: GitHub Actions CI/CD
            
            Download the attached `HabitSeen.apk` below to update your device.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/HabitSeen.apk
            bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
